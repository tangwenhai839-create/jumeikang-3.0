<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}体重管理系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">⚙️ 体重管理后台</div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                👥 学员
            </a>
            <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">
                ⚙️ 设置
            </a>
            <a href="/exports" class="nav-link {% if request.path == '/exports' %}active{% endif %}">
                📊 导出
            </a>
            <a href="#" class="nav-link" onclick="doLogout(); return false;">
                🚪 退出
            </a>
        </div>
        <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
    </nav>

    <!-- 主要内容 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 通用脚本 -->
    <script src="/static/js/app.js"></script>
    <script>
        async function doLogout() {
            if (!confirm('确定退出登录？')) return;
            try {
                await fetch('/api/logout', {method: 'POST'});
            } catch (e) {}
            window.location.href = '/login';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
